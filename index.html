<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#FFFCF6">
  <title>🦋Rin07｜Starmio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&family=Noto+Serif+SC:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper:#FFFCF6; --ink:#000000; --linen:#FAF0E6;
      --peach:#FFDAB9; --papaya:#FF7F00; --muted:#786f67; --ln4:#D6FE07;
      --line:#e8ded2; --reader-bg:#FFFCF6; --reader-ink:#171411;
      --serif:"Noto Serif SC",serif; --sans:"Noto Sans TC",sans-serif;
    }
    * { box-sizing:border-box; }
    body { position:relative; }
    body::before { content:""; position:fixed; inset:0; z-index:0; pointer-events:none; opacity:.22; }
    body > * { position:relative; z-index:1; }
    html { background:var(--paper); scroll-behavior:smooth; }
    body { margin:0; background:var(--paper); color:var(--ink); font-family:var(--serif); }
    button,input { font:inherit; }
    button { cursor:pointer; }
    .site-shell { width:min(100% - 40px, 900px); margin:0 auto; }
    .topbar { display:flex; align-items:center; justify-content:space-between; padding:30px 0 22px; border-bottom:1px solid var(--line); }
    .author { font:600 15px var(--sans); letter-spacing:.12em; }
    .top-note { color:var(--muted); font:12px var(--sans); letter-spacing:.08em; }
    .intro { padding:64px 0 34px; }
    .eyebrow { color:var(--ln4); font:600 13px var(--sans); letter-spacing:.2em; text-transform:uppercase; }
    .text-outline { -webkit-text-stroke: 1px #000; paint-order: stroke fill; }
    h1 { margin:12px 0 10px; font:500 clamp(28px,5vw,42px) var(--sans); letter-spacing:.06em; }
    .intro p { color:var(--muted); font-size:14px; line-height:1.9; margin:0; }
    .section-heading { display:flex; align-items:center; gap:14px; margin:18px 0 12px; font:500 12px var(--sans); letter-spacing:.16em; }
    .section-heading:after { content:""; height:3px; background:var(--ln4); flex:1; }
    #works { padding-bottom:90px; }
    .work { border-bottom:1px solid var(--papaya); }
    .work { position:relative; }
    .work:not(:last-child)::after { content:"LN4 X OP81"; position:absolute; right:0; bottom:-8px; padding:0 8px; background:var(--paper); color:#9A755F; font:11px var(--sans); letter-spacing:.04em; }
    .work-button { display:flex; align-items:flex-start; justify-content:space-between; gap:18px; width:100%; padding:23px 4px; border:0; background:transparent; color:inherit; text-align:left; }
    .work-button:hover .work-title { color:var(--papaya); }
    .work-title { display:block; font:500 18px/1.55 var(--sans); transition:color .15s; }
    .work-summary { display:block; margin-top:7px; color:var(--muted); font:13px/1.8 var(--serif); }
    .work-meta { flex:none; padding-top:5px; color:var(--muted); font:11px var(--sans); }
    .chevron { display:inline-block; margin-left:6px; transition:transform .2s; }
    .work.open .chevron { transform:rotate(180deg); }
    .chapter-list { display:none; padding:0 0 18px 18px; }
    .work.open .chapter-list { display:block; }
    .chapter-button { display:flex; justify-content:space-between; width:100%; padding:11px 12px; border:0; border-left:2px solid var(--peach); background:transparent; color:var(--ink); text-align:left; font:13px/1.7 var(--sans); }
    .chapter-button:hover { background:var(--linen); color:var(--ink); } .chapter-button:hover .chapter-label,.chapter-button:hover .chapter-number { background:transparent; color:var(--ink); }
    .chapter-number { color:var(--muted); font-size:11px; padding-left:12px; }
    .gate { display:none; margin:0 0 22px; padding:20px; background:var(--linen); border:1px solid #eadbc9; }
    .gate.visible { display:block; }
    .gate-title { margin:0 0 7px; font:500 15px var(--sans); }
    .hint { margin:0 0 14px; color:#6d6258; font-size:12px; line-height:1.8; white-space:pre-wrap; }
    .gate-row { display:flex; gap:8px; }
    .gate input { min-width:0; flex:1; padding:11px 12px; border:1px solid #d9c9b8; border-radius:0; background:var(--paper); color:var(--ink); outline:none; font:14px var(--sans); }
    .gate input:focus { border-color:var(--papaya); }
    .gate button,.back-button { border:0; padding:0 18px; background:var(--papaya); color:#fff; font:500 12px var(--sans); }
    .gate-error { min-height:18px; margin:9px 0 0; color:#9b3b1d; font:12px var(--sans); }
    .reader { display:none; min-height:100vh; background:var(--reader-bg); color:var(--reader-ink); }
    .reader.active { display:block; }
    .reader-inner { width:min(100% - 36px, 720px); margin:0 auto; padding:20px 0 70px; }
    .reader-toolbar { display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--line); padding:7px 0 16px; }
    .back-button { padding:9px 13px; background:var(--linen); color:var(--ink); }
    .mode-button { padding:9px 13px; border:1px solid var(--line); background:transparent; color:inherit; font:12px var(--sans); }
    .reader h2 { margin:46px 0 34px; text-align:center; font:500 clamp(22px,5vw,30px)/1.6 var(--sans); letter-spacing:.04em; }
    .chapter-nav { display:flex; justify-content:space-between; gap:12px; margin:0 0 28px; }
    .chapter-nav.bottom { margin:36px 0 0; }
    .chapter-nav button { border:0; background:transparent; color:var(--muted); padding:8px 0; font:12px var(--sans); }
    .chapter-nav button:disabled { visibility:hidden; }
    .article-body { font:16px/2.0 var(--serif); white-space:pre-wrap; overflow-wrap:anywhere; user-select:none; -webkit-user-select:none; }
    .article-body p { margin:0 0 1em; }
    .reader.night { --reader-bg:#201e1b; --reader-ink:#e9e0d5; --line:#49423b; }
    .reader.night .back-button { background:#39332d; color:#e9e0d5; }
    .reader.night .mode-button,.reader.night .chapter-nav button { color:#e9e0d5; }
    .reader.night .article-body { color:#e9e0d5; }
    .reader.night .reader-toolbar { border-color:#49423b; }
    .footer { padding:18px 0 28px; border-top:1px solid var(--line); color:var(--muted); font:11px var(--sans); letter-spacing:.08em; }
    .hidden { display:none !important; }
    @media (max-width:560px) {
      .site-shell { width:min(100% - 30px,900px); }
      .topbar { padding-top:23px; }
      .intro { padding:48px 0 27px; }
      .work-button { padding:19px 2px; }
      .work-title { font-size:16px; }
      .reader-inner { width:calc(100% - 34px); }
      .article-body { font-size:16px; line-height:2.0; }
      .gate-row { flex-direction:column; }
      .gate button { min-height:42px; }
    }
    /* 轻度防复制：只能提高门槛，不能阻止截图、开发者工具或网络请求查看。 */
    body, .article-body { -webkit-touch-callout:none; }
    h1,.work-title,.gate-title, .reader h2 { font-weight:600; }
    .reader-actions { display:flex; gap:8px; }
    .jump-wrap { position:relative; }
    .jump-menu { display:none; position:absolute; top:100%; left:0; z-index:10; margin:0; width:max-content; min-width:100%; max-width:80vw; border:1px solid var(--line); background:var(--reader-bg); }
    .jump-menu.open { display:flex; flex-direction:column; }
    .jump-menu button { padding:9px 16px; border:0; border-bottom:1px solid var(--line); background:transparent; color:var(--reader-ink); text-align:left; font:13px var(--sans); }
    .jump-menu button:last-child { border-bottom:0; }
    .jump-menu button:hover { background:var(--linen); }
    .top-link { display:flex; justify-content:flex-end; margin:24px 0 12px; }
    .top-link button { border:0; padding:6px 0 6px 12px; background:transparent; color:var(--muted); font:12px var(--sans); letter-spacing:.08em; }
    /*以下为赛道。*/
    .chapter-list { position:relative; }
    .chapter-button { position:relative; z-index:2; min-height:46px; }
    .chapter-label,.chapter-number { position:relative; z-index:2; }
    .spa-track { position:absolute; z-index:1; top:50%; left:50%; width:min(92%,500px); aspect-ratio:340/180; height:auto; transform:translate(-50%,-50%); pointer-events:none; }
    .spa-track svg { width:100%; height:100%; overflow:visible; }
    .spa-track path { fill:none; stroke-width:5; stroke-linecap:round; stroke-linejoin:round; }
    .spa-track .track-base { stroke:var(--paper); stroke-width:10; }
    .spa-track .track-green { stroke:#D6FE07; stroke-dasharray:50 50; }
    .spa-track .track-orange { stroke:#FF7F00; stroke-dasharray:50 50; stroke-dashoffset:-50; }
    .spa-track .track-outline { stroke:#000; stroke-width:12; }
    /* 以下为生日礼花相关，过了需要删除。 */
    .confetti-piece { position:fixed; top:-15px; width:5px; height:11px; z-index:9999; pointer-events:none; animation:confetti-fall 2s ease-in forwards; border-radius:2px; }
    @keyframes confetti-fall { 0% { transform:translate(0,0) rotate(0); opacity:1; } 100% { transform:translate(var(--drift),105vh) rotate(var(--spin)); opacity:0; } }
    /* 彩带动画容器：固定定位、穿透鼠标点击、支持溢出显示 */
    .popper-ribbon { position:fixed; z-index:9999; pointer-events:none; overflow:visible; animation:popper-fly 1.9s cubic-bezier(.12,.65,.35,1) forwards; }
    .popper-ribbon.large { width:19px; height:19px; }
    .popper-ribbon.medium { width:14px; height:11px; }
    .popper-ribbon.small { width:7px; height:11px; }
    .popper-ribbon svg { width:100%; height:100%; overflow:visible; }
    .popper-ribbon path { stroke-linecap:round; stroke-linejoin:round; }
    @keyframes popper-fly { 0% { transform:translate(0,0) rotate(var(--rotate)) scale(.35); opacity:0; } 12% { opacity:1; } 100% { transform:translate(var(--dx),var(--dy)) rotate(var(--spin)) scale(1); opacity:0; } }
    /* 以上为生日礼花相关，过了需要删除。 */
  </style>
</head>
<body>
  <main id="home" class="site-shell">
    <header class="topbar">
      <div class="author" id="author-id">AUTHOR ID</div>
      <div class="top-note">PRIVATE BOOKSHELF · FICTION</div>
    </header>
    <section class="intro">
      <div class="eyebrow text-outline">F1 World Champion 🏆 Lando Norris 生日快乐！</div>
      <h1>文章目录</h1>
      <p>选择篇名或章节，并输入对应密码即可阅读。</p>
    </section>
    <div class="section-heading">所有文章</div>
    <section id="works" aria-label="文章目录"></section>
    <div class="top-link"><button type="button" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑TOP</button></div>
    <footer class="footer">© <span id="year"></span> <span id="footer-author">AUTHOR ID</span></footer>
  </main>

  <section id="reader" class="reader" aria-label="文章阅读区">
    <div class="reader-inner">
      <div class="reader-toolbar">
  <button class="back-button" id="return-home" type="button">← 返回目录</button>
  <div class="reader-actions"><div class="jump-wrap"><button class="mode-button" id="jump-toggle" type="button">跳转章节</button><div class="jump-menu" id="jump-menu"></div></div><button class="mode-button" id="night-toggle" type="button">切换深夜模式</button></div>
</div>
      <h2 id="reader-title"></h2>
      <nav class="chapter-nav top" id="nav-top"></nav>
      <article class="article-body" id="article-body"></article>
      <nav class="chapter-nav bottom" id="nav-bottom"></nav>
      <div class="top-link"><button type="button" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑TOP</button></div>
    </div>
  </section>

  <script>
    /*
      只需要修改下方設定：
      1. AUTHOR_ID：作者 ID。
      2. API_URL：Cloudflare Worker 的網址（結尾不要加斜線）。
      3. WORKS：作品目錄。每篇 id 必須與 Worker 後台的 id 完全相同。
      4. 單章作品 chapters 只放一章；多章作品按閱讀順序排列。
      密碼與正文不放在這個 HTML，避免訪客從公開 GitHub 原始碼直接取得。
    */
    const CONFIG = {
      AUTHOR_ID: "Starmio🦋",
      API_URL: "https://twilight-water-3802reader.rin07.workers.dev",
      WORKS: [
        {
          id: "story-one",
          title: "[无差]在每一个宇宙都爱上你——南洋夏",
          summary: "阳光照在他的发顶，呈现隐约的金色，水珠挂在身上，欲顺着腹肌线条滴落。",
          chapters: [
            { id: "chapter-1", title: "一发完" }
          ]
        },
        {
          id: "story-three",
          title: "[无差]共感假日",
          summary: "Oscar从未遇到过这样直率的人，唇瓣张张合合，不知再夸奖他什么才不会显得越界无礼。",
          chapters: [
            { id: "chapter-1", title: "一发完" }
          ]
        },
        {
          id: "story-two",
          title: "[814]沉沦",
          summary: "当你抬头注视我时，是否也沉沦于此？",
          chapters: [{ id: "chapter-1", title: "Chapter 1" }, { id: "chapter-2", title: "Chapter 2" }, { id: "chapter-3", title: "Chapter 3" }, { id: "chapter-4", title: "Chapter 4" }, { id: "chapter-5", title: "Chapter 5" }, { id: "chapter-6", title: "Chapter 6" }, { id: "chapter-7", title: "Chapter 7" }, { id: "chapter-8", title: "Chapter 8" }, { id: "chapter-9", title: "Chapter 9" }, { id: "chapter-10", title: "Chapter 10" }, { id: "chapter-11", title: "Chapter 11" }]
        }
      ]
    };

    const home = document.getElementById("home");
    const reader = document.getElementById("reader");
    const worksRoot = document.getElementById("works");
    const unlocked = new Map(); // 僅存在記憶體；關閉或重新載入頁面後需重新輸入密碼。
    let current = null;

    document.getElementById("author-id").textContent = CONFIG.AUTHOR_ID;
    document.getElementById("footer-author").textContent = CONFIG.AUTHOR_ID;
    document.getElementById("year").textContent = new Date().getFullYear();

    function escapeHTML(value) {
      return String(value).replace(/[&<>"']/g, ch => ({
        "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
      })[ch]);
    }

    function renderDirectory() {
      worksRoot.innerHTML = "";
      CONFIG.WORKS.forEach((work, workIndex) => {
        const card = document.createElement("section");
        card.className = "work";
        const multi = work.chapters.length > 1;
        const button = document.createElement("button");
        button.type = "button";
        button.className = "work-button";
        button.innerHTML = `
          <span>
            <span class="work-title">${escapeHTML(work.title)}</span>
            <span class="work-summary">${escapeHTML(work.summary)}</span>
          </span>
          <span class="work-meta">${multi ? "短篇连载" : "一发完"}${multi ? '<span class="chevron">⌄</span>' : ""}</span>`;
        card.appendChild(button);

        if (multi) {
        const list = document.createElement("div"); list.className = "chapter-list";
        work.chapters.forEach((chapter, index) => {
        const chapterButton = document.createElement("button"); chapterButton.type = "button"; chapterButton.className = "chapter-button";
        chapterButton.innerHTML = `<span class="chapter-label">${escapeHTML(chapter.title)}</span><span class="chapter-number">${String(index+1).padStart(2,"0")}</span>`;
        chapterButton.addEventListener("click", () => openGate(workIndex, index, card)); list.appendChild(chapterButton);
  });
        card.appendChild(list);
        if(work.chapters.length>4){const track=document.createElement("div");track.className="spa-track";track.innerHTML=`<svg viewBox="0 0 340 180" preserveAspectRatio="xMidYMid meet"><path class="track-outline" d="M20 150 L42 105 L75 72 L100 68 L135 42 L230 8 L250 15 L265 10 L290 40 L310 60 L295 78 L260 68 L225 80 L220 105 L245 125 L270 130 L290 150 L270 172 L230 165 L205 125 L180 105 L150 115 L120 130 L90 140 L55 145 Z"/><path class="track-outline" d="M20 150 L42 105 L75 72 L100 68 L135 42 L230 8 L250 15 L265 10 L290 40 L310 60 L295 78 L260 68 L225 80 L220 105 L245 125 L270 130 L290 150 L270 172 L230 165 L205 125 L180 105 L150 115 L120 130 L90 140 L55 145 Z"/><path class="track-base" d="M20 150 L42 105 L75 72 L100 68 L135 42 L230 8 L250 15 L265 10 L290 40 L310 60 L295 78 L260 68 L225 80 L220 105 L245 125 L270 130 L290 150 L270 172 L230 165 L205 125 L180 105 L150 115 L120 130 L90 140 L55 145 Z"/><path class="track-green" d="M20 150 L42 105 L75 72 L100 68 L135 42 L230 8 L250 15 L265 10 L290 40 L310 60 L295 78 L260 68 L225 80 L220 105 L245 125 L270 130 L290 150 L270 172 L230 165 L205 125 L180 105 L150 115 L120 130 L90 140 L55 145 Z"/><path class="track-orange" d="M20 150 L42 105 L75 72 L100 68 L135 42 L230 8 L250 15 L265 10 L290 40 L310 60 L295 78 L260 68 L225 80 L220 105 L245 125 L270 130 L290 150 L270 172 L230 165 L205 125 L180 105 L150 115 L120 130 L90 140 L55 145 Z"/></svg>`;list.appendChild(track);}
        button.addEventListener("click", () => { card.classList.toggle("open"); const gate = card.querySelector(".gate"); if (gate) gate.classList.remove("visible"); });
  } else { button.addEventListener("click", () => openGate(workIndex, 0, card)); }

        const gate = document.createElement("div");
        gate.className = "gate";
        gate.innerHTML = `
          <p class="gate-title">请输入阅读密码</p>
          <p class="hint">${escapeHTML(work.hint || "密码提示见原帖。")}</p>
          <form class="gate-row">
            <input type="password" inputmode="text" autocomplete="off" maxlength="10"
              pattern="[A-Za-z0-9]{1,10}" placeholder="最多 10 位英文字母或数字"
              aria-label="阅读密码" required>
            <button type="submit">确认</button>
          </form>
          <p class="gate-error" aria-live="polite"></p>`;
        card.appendChild(gate);
        gate.querySelector("form").addEventListener("submit", event => {
          event.preventDefault();
          verifyPassword(workIndex, Number(gate.dataset.chapter || 0), gate);
        });
        worksRoot.appendChild(card);
      });
    }

    function openGate(workIndex, chapterIndex, card) {
  const gate = card.querySelector(".gate");
  const chapterButton = card.querySelectorAll(".chapter-button")[chapterIndex];
  const isSame = gate.classList.contains("visible") && Number(gate.dataset.work) === workIndex && Number(gate.dataset.chapter) === chapterIndex;
  document.querySelectorAll(".gate.visible").forEach(el => el.classList.remove("visible"));
  if (isSame) return;
  if (chapterButton) chapterButton.after(gate);
  gate.dataset.chapter = String(chapterIndex);
  gate.dataset.attempts = "0";
  gate.dataset.work = String(workIndex);
  gate.querySelector("input").value = "";
  gate.querySelector(".gate-error").textContent = "";
  gate.classList.add("visible");
  gate.querySelector("input").focus();
}

    async function verifyPassword(workIndex, chapterIndex, gate) {
      const input = gate.querySelector("input");
      const error = gate.querySelector(".gate-error");
      const password = input.value.trim();
      if (!/^[A-Za-z0-9]{1,10}$/.test(password)) {
        error.textContent = "密码只能包含 1–10 位英文字母或数字。";
        return;
      }
      const submit = gate.querySelector("button");
      submit.disabled = true;
      submit.textContent = "确认中…";
      error.textContent = "";
      const work = CONFIG.WORKS[workIndex];
      try {
        const response = await fetch(`${CONFIG.API_URL}/api/unlock`, {
          method:"POST",
          headers:{"Content-Type":"application/json"},
          body:JSON.stringify({workId:work.id, password})
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "密码错误");
        unlocked.set(work.id, data);
        showChapter(workIndex, chapterIndex);
      } catch (err) {
        console.error("解锁失败：", err);
        const attempts = Number(gate.dataset.attempts || 0) + 1;
        gate.dataset.attempts = String(attempts);
        input.value = "";
        if (attempts >= 2) {
          gate.classList.remove("visible");
          error.textContent = "";
          window.scrollTo({top:0,behavior:"smooth"});
          alert("请看原贴密码提示。");
        } else {
          error.textContent = "密码不正确。";
          input.focus();
        }
      } finally {
        submit.disabled = false;
        submit.textContent = "确认";
      }
    }

    function showChapter(workIndex, chapterIndex) {
      const work = CONFIG.WORKS[workIndex];
      const data = unlocked.get(work.id);
      const chapter = work.chapters[chapterIndex];
      const bodyText = data.chapters?.[chapter.id];
      if (typeof bodyText !== "string") {
        alert("后台尚未找到这一章的內容，请联系作者。");
        return;
      }
      current = {workIndex, chapterIndex};
      home.classList.add("hidden");
      reader.classList.add("active");
      reader.classList.remove("night");
      document.getElementById("reader-title").textContent =
        work.chapters.length > 1 ? `${work.title}｜${chapter.title}` : work.title;
      document.getElementById("article-body").textContent = bodyText;
      renderChapterNav();
      document.getElementById("jump-toggle").style.display=work.chapters.length>1?"":"none"; document.getElementById("jump-menu").classList.remove("open");
      window.scrollTo(0,0);
    }

    function renderChapterNav() {
      const {workIndex, chapterIndex} = current;
      const work = CONFIG.WORKS[workIndex];
      const top = document.getElementById("nav-top");
      const bottom = document.getElementById("nav-bottom");
      top.innerHTML = ""; bottom.innerHTML = "";
      if (work.chapters.length <= 1) return;
      [top,bottom].forEach(nav => {
        const prev = document.createElement("button");
        prev.type = "button";
        prev.textContent = "← 上一章";
        prev.disabled = chapterIndex === 0;
        prev.addEventListener("click", () => showChapter(workIndex, chapterIndex-1));
        const next = document.createElement("button");
        next.type = "button";
        next.textContent = "下一章 →";
        next.disabled = chapterIndex === work.chapters.length-1;
        next.addEventListener("click", () => showChapter(workIndex, chapterIndex+1));
        nav.append(prev,next);
      });
    }

    document.getElementById("jump-toggle").addEventListener("click", () => {
      if (!current) return;
      const menu = document.getElementById("jump-menu");
      const work = CONFIG.WORKS[current.workIndex];
      menu.innerHTML = "";
      work.chapters.forEach((chapter, index) => {
        const item = document.createElement("button");
        item.type = "button";
        item.textContent = chapter.title;
        item.addEventListener("click", () => {
          menu.classList.remove("open");
          showChapter(current.workIndex, index);
        });
        menu.appendChild(item);
      });
      menu.classList.toggle("open");
    });

    document.getElementById("return-home").addEventListener("click", () => {
      current = null;
      reader.classList.remove("active","night");
      home.classList.remove("hidden");
      window.scrollTo(0,0);
    });
    document.getElementById("night-toggle").addEventListener("click", () => {
      reader.classList.toggle("night");
      document.getElementById("night-toggle").textContent =
        reader.classList.contains("night") ? "切换白天模式" : "切换深夜模式";
    });

    // 轻度防复制措施：不等同于真正的 DRM，无法阻止截图、拍照或技术性提取。
    document.addEventListener("contextmenu", e => { if (reader.classList.contains("active")) e.preventDefault(); });
    document.addEventListener("copy", e => { if (reader.classList.contains("active")) e.preventDefault(); });
    document.addEventListener("cut", e => { if (reader.classList.contains("active")) e.preventDefault(); });
    document.addEventListener("selectstart", e => { if (reader.classList.contains("active")) e.preventDefault(); });
    document.addEventListener("keydown", e => {
      if (!reader.classList.contains("active")) return;
      const key = e.key.toLowerCase();
      if ((e.ctrlKey || e.metaKey) && ["c","x","a","s","p","u"].includes(key)) e.preventDefault();
    });

    /* 以下为生日礼花相关，过了需要删除。 */
    function celebratePopper(){
  const line=document.querySelector(".eyebrow");
  if(!line)return;
  const rect=line.getBoundingClientRect();
  const colors=["#E76F6A","#65A878","#F2C94C","#F2994A","#79BDE8"];
  const shapes=[
    {size:"large",svg:'<path d="M10 9 C4 8 5 2 10 3 C15 4 15 10 10 13 C7 15 4 13 5 11" fill="none" stroke="COLOR" stroke-width="2.8"/>'},
    {size:"small",svg:'<path d="M5 2 L12 3 L10 13 L4 12 Z" fill="COLOR"/>'},
    {size:"medium",svg:'<path d="M1 7 Q4 3 7 6 L10 8 Q12 9 14 5 L13 10 Q10 13 7 9 L4 8 Z" fill="COLOR"/>'},
    {size:"small",svg:'<path d="M3 2 L10 1 L12 10 L5 11 Z" fill="COLOR"/>'},
    {size:"medium",svg:'<path d="M1 4 Q4 1 7 5 L10 8 Q12 10 14 6 L13 10 Q10 13 7 9 L4 7 Z" fill="COLOR"/>'},
    {size:"large",svg:'<path d="M4 11 C2 7 5 3 9 4 C13 5 14 9 11 12 C9 14 6 13 6 10" fill="none" stroke="COLOR" stroke-width="2.5"/>'}
  ];
  [rect.left+8,rect.right-25].forEach((x,side)=>{
    for(let i=0;i<17;i++){
      const el=document.createElement("span");
      const shape=shapes[Math.floor(Math.random()*shapes.length)];
      const color=colors[Math.floor(Math.random()*colors.length)];
      const angle=25+Math.random()*65;
      const distance=65+Math.random()*115;
      const rad=angle*Math.PI/180;
      el.className="popper-ribbon "+shape.size;
      el.style.left=(x+(Math.random()*18-9))+"px";
      el.style.top=(rect.top-12+(Math.random()*12-6))+"px";
      el.style.setProperty("--dx",(side===0?-1:1)*Math.cos(rad)*distance+"px");
      el.style.setProperty("--dy",-Math.sin(rad)*distance-20+"px");
      el.style.setProperty("--rotate",(Math.random()*180-90)+"deg");
      el.style.setProperty("--spin",(Math.random()*500-250)+"deg");
      el.style.animationDelay=Math.random()*.22+"s";
      el.innerHTML=`<svg viewBox="0 0 16 16">${shape.svg.replaceAll("COLOR",color)}</svg>`;
      document.body.appendChild(el);
      setTimeout(()=>el.remove(),2300);
    }
  });
}
